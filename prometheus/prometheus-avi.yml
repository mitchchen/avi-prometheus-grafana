    static_configs:
      - targets: ['avi-exporter:9103']

  - job_name: 'avi_virtualservice'
    honor_timestamps: true
    scrape_interval: 1m
    scrape_timeout: 45s
    metrics_path: /metrics/virtualservice
    params:
      tenant: ['admin']
    metric_relabel_configs:
      - source_labels: [instance]
        regex: '(.*)'
