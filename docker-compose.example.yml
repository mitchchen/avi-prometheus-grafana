# Turnkey Docker Compose stack for VMware Avi Load Balancer observability.
# See README.md for the full step-by-step Quick Start (Avi RO user, secrets/, certs/, verification).
#
# Required files before running `docker compose -f docker-compose.example.yml up -d`:
#   1. secrets/avi-exporter.env  -> copy from .env.example (chmod 600), set AVI_USERNAME & AVI_PASSWORD
#   2. certs/corp-root-ca.pem    -> your enterprise Root CA PEM (or Avi self-signed cert exported via openssl)
#                                   NOTE: If your Avi Controller uses a publicly trusted CA (DigiCert,
#                                   Let's Encrypt, etc.), remove AVI_CA_FILE and the certs volume mount below.
#   3. Update AVI_CONTROLLER and AVI_API_VERSION below, and set your friendly cluster name in
#      prometheus/prometheus-avi.yml (replace 'avi-prod-west').

services:
  avi-exporter:
    image: python:3.12-alpine
    container_name: avi-exporter
    restart: unless-stopped
    command: ["python3", "/app/avi_exporter.py"]
    env_file:
      # Holds AVI_USERNAME and AVI_PASSWORD (no quotes around values; chmod 600)
      - ./secrets/avi-exporter.env
    environment:
      # Avi Controller management FQDN or IP (must match CN/SAN in the Controller's TLS certificate)
      - AVI_CONTROLLER=avi-ctrl.corp.example
      # Match your Avi Controller software version (e.g. 30.2.1, 31.2.1, 32.1.4)
      - AVI_API_VERSION=32.1.4
      # Default Avi tenant to query (individual Prometheus jobs can override via ?tenant=<name>)
      - AVI_TENANT=admin
      # Path inside the container to your PEM CA bundle; omit/remove if using a publicly trusted cert
      - AVI_CA_FILE=/etc/ssl/certs/corp-root-ca.pem
      # In-memory response cache TTL in seconds (reduces Controller API load)
      - AVI_CACHE_TTL=20
    volumes:
      - ./exporters/avi_exporter.py:/app/avi_exporter.py:ro
      # Mount your enterprise Root CA (or pinned self-signed Controller cert); remove if using a public CA
      - ./certs/corp-root-ca.pem:/etc/ssl/certs/corp-root-ca.pem:ro
    networks:
      - monitoring
    # Intentionally NOT exposed on host ports — scraped privately by Prometheus only.

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus-avi.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      # Change to "127.0.0.1:3000:3000" if placing Grafana behind an HTTPS reverse proxy
      - "3000:3000"
    environment:
      # Change these defaults before exposing Grafana beyond localhost
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards-avi:ro
      - ./alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
