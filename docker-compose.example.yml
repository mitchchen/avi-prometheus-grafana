# Turnkey local/lab Docker Compose stack for VMware Avi Load Balancer observability.
# Quick start:
#   1. cp .env.example secrets/avi-exporter.env && chmod 600 secrets/avi-exporter.env
#   2. Place your enterprise root CA PEM at certs/corp-root-ca.pem (or remove AVI_CA_FILE for public CA)
#   3. Set AVI_CONTROLLER and AVI_API_VERSION below
#   4. docker compose -f docker-compose.example.yml up -d
#   5. Open http://localhost:3000 (default Grafana admin/admin — change on first login)

services:
  avi-exporter:
    image: python:3.12-alpine
    container_name: avi-exporter
    restart: unless-stopped
    command: ["python3", "/app/avi_exporter.py"]
    env_file:
      - ./secrets/avi-exporter.env
    environment:
      - AVI_CONTROLLER=avi-ctrl.corp.example
      - AVI_API_VERSION=32.1.4
      - AVI_TENANT=admin
      - AVI_CA_FILE=/etc/ssl/certs/corp-root-ca.pem
      - AVI_CACHE_TTL=20
    volumes:
      - ./exporters/avi_exporter.py:/app/avi_exporter.py:ro
      - ./certs/corp-root-ca.pem:/etc/ssl/certs/corp-root-ca.pem:ro
    networks:
      - monitoring
    # Intentionally NOT exposed on host ports — scraped privately by Prometheus only.

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus-avi.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards-avi:ro
      - ./alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
